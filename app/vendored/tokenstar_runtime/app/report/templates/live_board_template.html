<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>TokenStar Live Board</title>
  <style>
    :root {
      --bg0: #f8fafc;
      --bg1: #eaf2ff;
      --panel: rgba(255, 255, 255, 0.94);
      --panel2: #f8fafc;
      --line: rgba(148, 163, 184, 0.24);
      --line2: rgba(37, 99, 235, 0.32);
      --text: #0f172a;
      --muted: #64748b;
      --muted2: #94a3b8;
      --cyan: #0891b2;
      --blue: #2563eb;
      --purple: #7c3aed;
      --green: #059669;
      --yellow: #d97706;
      --red: #dc2626;
      --shadow: 0 18px 56px rgba(15, 23, 42, 0.10);
      --glow: 0 10px 30px rgba(37, 99, 235, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(37, 99, 235, 0.10), transparent 30rem),
        radial-gradient(circle at 90% 4%, rgba(14, 165, 233, 0.12), transparent 32rem),
        linear-gradient(135deg, var(--bg0), var(--bg1) 58%, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-feature-settings: "tnum";
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(37, 99, 235, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 99, 235, 0.045) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.35), transparent 82%);
    }
    body::after {
      display: none;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page {
      position: relative;
      z-index: 1;
      width: min(1760px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      margin-bottom: 18px;
    }
    .topbar.single {
      grid-template-columns: 1fr;
    }
    .hero, .status-orb, .panel, .kpi-card, .filterbar {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.92));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
    }
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 210px;
      border-radius: 30px;
      padding: 28px 30px;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      background:
        radial-gradient(circle at 82% 20%, rgba(37, 99, 235, 0.10), transparent 22rem),
        radial-gradient(circle at 24% 100%, rgba(14, 165, 233, 0.10), transparent 24rem);
    }
    .hero-content { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
      padding: 8px 12px;
      border: 1px solid rgba(37, 99, 235, 0.18);
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: none;
    }
    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 4vw, 66px);
      line-height: 0.96;
      letter-spacing: -0.06em;
      text-shadow: none;
    }
    .subtitle {
      max-width: 920px;
      margin: 16px 0 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .meta-line { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
    }
    .chip b { color: #0f172a; font-weight: 750; }
    .status-orb {
      position: relative;
      overflow: hidden;
      min-height: 210px;
      border-radius: 30px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .status-orb::before {
      content: "";
      position: absolute;
      inset: auto -64px -96px auto;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, #d1fae5, #dbeafe, #ede9fe, #d1fae5);
      opacity: 0.95;
      filter: blur(1px);
    }
    .status-orb .label { color: var(--muted); font-size: 13px; }
    .status-orb .big {
      position: relative;
      z-index: 1;
      margin: 10px 0;
      font-size: 58px;
      line-height: 1;
      letter-spacing: -0.08em;
      font-weight: 850;
    }
    .status-orb .note { position: relative; z-index: 1; color: var(--muted); line-height: 1.6; font-size: 13px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      position: relative;
      overflow: hidden;
      min-height: 118px;
      border-radius: 22px;
      padding: 16px;
    }
    .kpi-card::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -22px;
      width: 86px;
      height: 86px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(167, 139, 250, 0.08));
      transform: rotate(18deg);
    }
    .kpi-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .kpi-card strong {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 14px;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.055em;
    }
    .kpi-card small {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 10px;
      color: var(--muted2);
      font-size: 12px;
    }
    .tone-pass strong { color: var(--green); text-shadow: none; }
    .tone-warn strong { color: var(--yellow); text-shadow: none; }
    .tone-fail strong { color: var(--red); text-shadow: none; }
    .cmp-band {
      display: none;
      margin-bottom: 18px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 22px;
      padding: 20px 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.9));
      box-shadow: var(--shadow);
    }
    .cmp-band.visible { display: block; }
    .cmp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .cmp-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
    .cmp-head span { color: var(--muted); font-size: 13px; }
    .cmp-deltas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .cmp-delta {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 12px;
      background: #ffffff;
    }
    .cmp-delta span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .cmp-delta strong { display: block; margin-top: 8px; font-size: 20px; letter-spacing: -0.03em; }
    .cmp-delta.trend-up strong { color: var(--green); }
    .cmp-delta.trend-down strong { color: var(--red); }
    .cmp-delta.trend-neutral strong { color: #475569; }
    .cmp-changes { display: grid; gap: 8px; }
    .cmp-change {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .cmp-change.bad { background: #fef2f2; border-color: rgba(220, 38, 38, 0.18); color: var(--red); }
    .cmp-change.good { background: #ecfdf5; border-color: rgba(5, 150, 105, 0.18); color: var(--green); }
    .cmp-change.new { background: #eff6ff; border-color: rgba(37, 99, 235, 0.18); color: var(--blue); }
    .cmp-none { color: var(--muted); font-size: 13px; }

    .filterbar {
      position: sticky;
      top: 12px;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      border-radius: 20px;
      padding: 12px;
    }
    .search {
      width: 100%;
      height: 42px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      outline: none;
      padding: 0 14px;
      color: var(--text);
      background: #ffffff;
    }
    .search:focus { border-color: rgba(37, 99, 235, 0.55); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .filter-btn, .ghost-btn {
      min-height: 38px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 999px;
      padding: 8px 12px;
      color: #475569;
      background: #ffffff;
    }
    .filter-btn.active, .filter-btn:hover, .ghost-btn:hover {
      border-color: rgba(37, 99, 235, 0.36);
      color: #1d4ed8;
      background: #eff6ff;
      box-shadow: none;
    }
    .board-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
      gap: 18px;
      align-items: start;
    }
    .left-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .panel { overflow: hidden; border-radius: 24px; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 0;
    }
    .panel-title { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
    .panel-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 18px; }
    .wide { grid-column: 1 / -1; }
    .ring-wrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 18px; align-items: center; }
    .ring {
      --pass-deg: 0deg;
      --warn-deg: 0deg;
      width: 178px;
      height: 178px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, #ffffff 0 56%, transparent 57%),
        conic-gradient(var(--green) 0 var(--pass-deg), var(--yellow) var(--pass-deg) calc(var(--pass-deg) + var(--warn-deg)), var(--red) calc(var(--pass-deg) + var(--warn-deg)) 360deg);
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.16), 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    .ring strong { font-size: 34px; letter-spacing: -0.06em; }
    .ring small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; text-align: center; letter-spacing: 0.12em; }
    .legend { display: grid; gap: 10px; }
    .legend-row { display: grid; grid-template-columns: 82px 1fr auto; gap: 10px; align-items: center; color: #475569; font-size: 13px; }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
    .legend-dot.pass { background: var(--green); box-shadow: none; }
    .legend-dot.warn { background: var(--yellow); box-shadow: none; }
    .legend-dot.fail { background: var(--red); box-shadow: none; }
    .bar { height: 8px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
    .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--purple)); }
    .matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .agent-tile {
      position: relative;
      min-height: 62px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      overflow: hidden;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .agent-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.8;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), transparent);
    }
    .agent-tile.pass { border-color: rgba(5, 150, 105, 0.32); box-shadow: 0 8px 18px rgba(5, 150, 105, 0.06); }
    .agent-tile.warn { border-color: rgba(217, 119, 6, 0.35); box-shadow: 0 8px 18px rgba(217, 119, 6, 0.06); }
    .agent-tile.fail { border-color: rgba(220, 38, 38, 0.38); box-shadow: 0 8px 18px rgba(220, 38, 38, 0.07); }
    .agent-tile.info { border-color: rgba(37, 99, 235, 0.30); }
    .agent-tile.active, .agent-tile:hover { transform: translateY(-2px) scale(1.02); border-color: rgba(37, 99, 235, 0.55); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.12); }
    .agent-tile span {
      position: relative;
      z-index: 1;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      padding: 10px 10px;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .heat-list, .rank-list, .issue-list { display: grid; gap: 10px; }
    .rank-list { max-height: 420px; overflow: auto; padding-right: 2px; }
    .heat-row, .rank-row, .issue-row {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 16px;
      padding: 12px;
      color: var(--text);
      background: #ffffff;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    .heat-row:hover, .rank-row:hover, .issue-row:hover, .heat-row.active { transform: translateY(-1px); border-color: rgba(37, 99, 235, 0.36); background: #f8fbff; }
    .row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .row-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 760; }
    .row-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .heat-track { height: 9px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
    .heat-track span { display: block; height: 100%; border-radius: inherit; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: none; }
    .status-badge.pass { color: var(--green); background: #ecfdf5; border-color: rgba(5, 150, 105, 0.18); }
    .status-badge.warn { color: var(--yellow); background: #fffbeb; border-color: rgba(217, 119, 6, 0.20); }
    .status-badge.fail { color: var(--red); background: #fef2f2; border-color: rgba(220, 38, 38, 0.20); }
    .status-badge.info { color: var(--blue); background: #eff6ff; border-color: rgba(37, 99, 235, 0.18); }
    .status-badge.unknown { color: var(--muted); background: #f1f5f9; border-color: rgba(148, 163, 184, 0.20); }
    .detail-panel { position: sticky; top: 86px; }
    .detail-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      padding: 18px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 90% 20%, rgba(37, 99, 235, 0.08), transparent 14rem),
        #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .detail-hero h2 { margin: 0; font-size: 24px; letter-spacing: -0.04em; word-break: break-word; }
    .detail-hero p { margin: 8px 0 0; color: var(--muted); word-break: break-word; }
    .score-pill {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      border-radius: 24px;
      background: #ffffff;
      border: 1px solid rgba(37, 99, 235, 0.18);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.10);
    }
    .score-pill strong { display: block; font-size: 26px; letter-spacing: -0.05em; }
    .score-pill span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .mini-metric {
      border: 1px solid rgba(148, 163, 184, 0.20);
      border-radius: 14px;
      padding: 11px;
      background: #ffffff;
    }
    .mini-metric span { display: block; color: var(--muted); font-size: 11px; }
    .mini-metric strong { display: block; margin-top: 6px; font-size: 17px; }
    .test-list { display: grid; gap: 10px; margin-top: 14px; }
    .test-card { border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 16px; padding: 12px; background: #ffffff; }
    .test-card.fail { border-color: rgba(220, 38, 38, 0.24); background: #fef2f2; }
    .test-card.warn { border-color: rgba(217, 119, 6, 0.24); background: #fffbeb; }
    .test-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .test-name { font-weight: 750; }
    .test-msg { color: #475569; font-size: 12px; line-height: 1.55; word-break: break-word; }
    .error-msg { color: var(--fail); font-weight: 650; }
    details.raw-json { margin-top: 14px; border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 16px; background: #f8fafc; }
    details.raw-json summary { padding: 12px 14px; color: #334155; cursor: pointer; }
    pre {
      max-height: 360px;
      overflow: auto;
      margin: 0;
      padding: 0 14px 14px;
      color: #1e293b;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(148, 163, 184, 0.32);
      border-radius: 16px;
      background: #f8fafc;
    }
    @media (max-width: 1320px) {
      .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .board-grid { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
    }
    @media (max-width: 920px) {
      .page { width: min(100vw - 20px, 1760px); padding-top: 10px; }
      .topbar, .filterbar, .ring-wrap { grid-template-columns: 1fr; }
      .left-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { justify-content: flex-start; }
      .detail-hero, .metric-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .hero { padding: 22px; border-radius: 22px; }
      .kpi-grid, .detail-hero, .metric-grid { grid-template-columns: 1fr; }
      .score-pill { width: 100%; height: 72px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar single">
      <header class="hero">
        <div class="hero-content">
          <span class="eyebrow">TokenStar 测试大屏</span>
          <h1>模型中转测试大屏</h1>
          <p class="subtitle">按中转、模型和测试项拆解运行结果。点击任意状态块、热力条或异常项，可以在右侧查看详细结果和原始 JSON。</p>
          <div class="meta-line" id="metaLine"></div>
        </div>
      </header>
    </section>

    <section class="kpi-grid" id="kpiGrid" aria-label="核心指标"></section>

    <section class="cmp-band" id="cmpBand" aria-label="历史对比">
      <div class="cmp-head">
        <div><h2>历史对比</h2><span id="cmpSubtitle"></span></div>
        <span class="chip" id="cmpChip" style="display:none"></span>
      </div>
      <div class="cmp-deltas" id="cmpDeltas"></div>
      <div class="cmp-changes" id="cmpChanges"></div>
    </section>

    <section class="cmp-band" id="baselineBand" aria-label="基线偏差" style="display:none">
      <div class="cmp-head">
        <div><h2>基线偏差</h2><span id="baselineSubtitle"></span></div>
        <span class="chip" id="baselineChip" style="display:none"></span>
      </div>
      <div class="cmp-changes" id="baselineChanges"></div>
    </section>

    <section class="filterbar" aria-label="筛选工具">
      <input class="search" id="searchInput" placeholder="搜索中转、模型、测试项或失败原因..." autocomplete="off">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="fail">只看失败</button>
        <button class="filter-btn" data-filter="warn">只看警告</button>
        <button class="filter-btn" data-filter="slow">高延迟</button>
        <button class="filter-btn" data-filter="critical">安全底线</button>
        <button class="ghost-btn" id="clearGroup" type="button">清除中转筛选</button>
      </div>

      const labels = {
        hard_pass_rate: '硬指标通过率', soft_health: '软指标健康度', critical_failed: '安全底线失败',
        failed: '失败数', warned: '警告数', estimated_cost: '预估成本', avg_latency_ms: '平均延迟'
      };
      const deltas = cmp.deltas || {};
      document.getElementById('cmpDeltas').innerHTML = Object.entries(deltas).map(([key, item]) => {
        const trendIcon = { up: '↑', down: '↓', neutral: '→' }[item.trend] || '→';
        return `<div class="cmp-delta trend-${item.trend}"><span>${labels[key] || key}</span><strong>${trendIcon} ${esc(item.display)}</strong></div>`;
      }).join('') || '<div class="cmp-none">无指标变化。</div>';

      const changes = cmp.provider_changes || [];
      document.getElementById('cmpChanges').innerHTML = changes.length
        ? changes.map(ch => `<span class="cmp-change ${ch.change === 'status' && ch.to === 'fail' ? 'bad' : ch.change === 'status' && ch.to === 'pass' ? 'good' : ch.change === 'new' ? 'new' : ''}">${esc(ch.label)}: ${esc(ch.provider)} / ${esc(ch.model)}</span>`).join('')
        : '';
    }
    function renderBaseline() {
      const comparisons = report.baseline_comparisons;
      const band = document.getElementById('baselineBand');
      if (!comparisons || !comparisons.length) { band.style.display = 'none'; return; }
      const devProviders = comparisons.filter(c => c.has_deviations);
      if (!devProviders.length) { band.style.display = 'none'; return; }
      band.style.display = '';
      document.getElementById('baselineSubtitle').textContent = `${devProviders.length} 个中转存在基线偏差`;
      const allDevs = [];
      devProviders.forEach(c => {
        c.deviations.forEach(d => {
          allDevs.push({ ...d, provider: c.provider, model: c.model });
        });
      });
      document.getElementById('baselineChanges').innerHTML = allDevs.map(d => {
        const dirIcon = d.direction === 'above' ? '↑' : '↓';
        return `<span class="cmp-change bad">${esc(d.provider)}/${esc(d.model)}: ${esc(d.label)} ${dirIcon} ${esc(String(d.current))}${esc(d.unit)} (基线 ${esc(String(d.baseline))}${esc(d.unit)})</span>`;
      }).join('');
      const hist = report.historical_baseline;
      if (hist) {
        document.getElementById('baselineSubtitle').textContent += `  |  历史基线(${hist.lookback_runs}次): 通过率均${hist.avg_hard_pass_rate}%`;
      }
    }
    function renderAll() { renderMeta(); renderHero(); renderKpis(); renderRing(); renderComparison(); renderBaseline(); renderMatrix(); renderHeatMap(); renderLatencyRank(); renderIssues(); renderDetail(); }

    document.getElementById('searchInput').addEventListener('input', event => { state.search = event.target.value.trim(); ensureSelection(); renderAll(); });
    document.querySelectorAll('.filter-btn').forEach(button => button.addEventListener('click', () => { state.filter = button.dataset.filter; document.querySelectorAll('.filter-btn').forEach(item => item.classList.toggle('active', item === button)); ensureSelection(); renderAll(); }));
    document.getElementById('clearGroup').addEventListener('click', () => { state.group = ''; ensureSelection(); renderAll(); });
    state.selectedId = (providers.find(provider => provider.status === 'fail') || providers.find(provider => provider.status === 'warn') || providers[0] || {}).id || '';
    renderAll();
  </script>
</body>
</html>
